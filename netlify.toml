[build]
  # Nothing to build: the site is served as committed and Netlify bundles the function itself.
  # Kept as an explicit no-op so a build command set in the Netlify UI can't take over.
  command = "echo 'No build step'"
  functions = "/functions"
  publish = "."

  ## Uncomment to use this redirect for Single Page Applications like create-react-app.
  ## Not needed for static site generators.
  #[[redirects]]
  #  from = "/*"
  #  to = "/index.html"
  #  status = 200

  ## (optional) Settings for Netlify Dev
  ## https://github.com/netlify/cli/blob/main/docs/netlify-dev.md#project-detection
  #[dev]
  #  command = "yarn start" # Command to start your dev server
  #  port = 3000 # Port that the dev server will be listening on
  #  publish = "dist" # Folder with the static content for _redirect file

  ## more info on configuring this file: https://www.netlify.com/docs/netlify-toml-reference/

# Security headers for the site's files (the function sets its own).
# The CSP is report-only for now: browsers log violations in the console but block nothing.
# Once the live site's console stays clean, rename the key to Content-Security-Policy to enforce it.
# frame-ancestors 'none' means no other site can embed the game in an iframe; to embed it
# somewhere (a portfolio, say), add that site's origin there before enforcing.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; img-src 'self' https://images.unsplash.com; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
